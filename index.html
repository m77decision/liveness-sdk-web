<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação Facial (Liveness)</title>
    <style>
        :root {
            --primary-color: #D02780;
            --primary-hover: #b01f6a;
            --bg-color: #f4f4f9;
            --text-color: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 760px; /* Suficiente para acomodar o desktop (720px) */
            padding: 30px;
            text-align: center;
        }

        .card h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #222;
        }

        .card p {
            font-size: 1rem;
            color: #666;
            margin-bottom: 20px;
        }

        /* Container de vídeo */
        #video-wrapper {
            width: 100%;
            margin: 0 auto 20px auto;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            display: none; /* Escondido até clicar em iniciar */
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: 600;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #result-container {
            margin-top: 20px;
            display: none;
        }

        #result-container img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Verificação de Identidade</h1>
        <p id="instructions">Precisamos confirmar que é você. Certifique-se de estar em um local iluminado.</p>
        
        <div id="video-wrapper"></div>
        
        <button id="start-btn" class="btn">Iniciar Câmera</button>

        <div id="result-container">
            <h3 id="result-message"></h3>
            <img id="result-image" alt="Selfie capturada" />
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/m77decision/liveness-sdk-web/dist/v3/liveness.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const startBtn = document.getElementById('start-btn');
            const videoWrapper = document.getElementById('video-wrapper');
            const instructions = document.getElementById('instructions');
            const resultContainer = document.getElementById('result-container');
            const resultMessage = document.getElementById('result-message');
            const resultImage = document.getElementById('result-image');

            // 1. Função que detecta se é Mobile
            const isMobileDevice = () => {
                return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            };

            // 2. Configurações base compartilhadas
            const getBaseOptions = () => ({
                token: "SEU_TOKEN_AQUI", // Insira seu token válido
                isDebug: true, // Mostra as marcações na tela
                shouldCheckNeutralFace: false, // Define se exige rosto neutro
                faceapiPath: 'https://cdn.jsdelivr.net/gh/m77decision/liveness-sdk-web/libs/',
                isShowPreview: true,
                // Callbacks de resposta
                successCallback: (response) => {
                    videoWrapper.style.display = 'none';
                    resultContainer.style.display = 'block';
                    resultMessage.style.color = "green";
                    resultMessage.textContent = "Validação concluída com sucesso!";
                    resultImage.src = response.base64;
                    console.log("Sucesso:", response);
                },
                
                errorCallback: (error) => {
                    videoWrapper.style.display = 'none';
                    resultContainer.style.display = 'block';
                    resultMessage.style.color = "red";
                    resultMessage.textContent = "Falha na validação. Tente novamente.";
                    if(error.base64) resultImage.src = error.base64;
                    console.error("Erro:", error);
                    startBtn.style.display = 'inline-block';
                    startBtn.textContent = 'Tentar Novamente';
                    startBtn.disabled = false;
                }
            });

            // 3. Monta a configuração final baseada no dispositivo
            const buildOptions = () => {
                const baseOptions = getBaseOptions();
                
                if (isMobileDevice()) {
                    console.log("📱 Configurando para ambiente Mobile");
                    return {
                        ...baseOptions,
                        mobileFacingMode: "user",
                        frameBox: {
                            eyesInner: 0.62,
                            eyesOutter: 1.1,
                            box: 0.52,
                        },
                        ellipseMaskWidth: 2,
                        ellipseMaskHeight: 3.8,
                        ellipseMaskTop: 2.2,
                        ellipseMaskLeft: 2
                    };
                } else {
                    console.log("💻 Configurando para ambiente Desktop");
                    return {
                        ...baseOptions,
                        width: 720,
                        height: 720 / (4 / 3),
                        frameBox: {
                            eyesInner: 0.52,
                            eyesOutter: 1.1,
                            box: 0.5,
                        }
                    };
                }
            };

            // 4. Ação do Botão Iniciar
            startBtn.addEventListener('click', () => {
                startBtn.disabled = true;
                startBtn.textContent = 'Carregando câmera...';
                startBtn.style.display = 'none'; // Esconde o botão após iniciar
                
                resultContainer.style.display = 'none';
                videoWrapper.style.display = 'block'; // Mostra a caixa preta
                instructions.textContent = "Siga as instruções na tela. Encaixe seu rosto na marcação.";

                const options = buildOptions();

                try {
                    // Instancia a classe
                    const liveness = new window.Liveness(videoWrapper, options);
                    
                    // Inicia o processo
                    liveness.start(() => {
                        console.log("Câmera e Liveness iniciados com sucesso!");
                    });
                } catch (e) {
                    console.error("Erro ao instanciar Liveness:", e);
                    alert("Ocorreu um erro ao carregar o script. Verifique o console.");
                    startBtn.style.display = 'inline-block';
                    startBtn.textContent = 'Iniciar Câmera';
                    startBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
