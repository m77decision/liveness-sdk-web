<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liveness Check</title>
    <style>
        :root {
            --cor-primaria: #26285e;
            --cor-fundo: #1a1a1a;
            --cor-secundaria: #46E3C3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        *::before, *::after { box-sizing: inherit; }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--cor-fundo);
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Wrapper em Grid para centralizar o vídeo */
        #wrapper {
            display: grid;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
        }

        #liveness-viewport {
            position: relative;
            width: 640px;
            height: 480px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #333;
        }

        /* Ajuste do Modal Conforme seu estilo */
        #modalWrapper {
            top: 50% !important;
            left: 50% !important;
            position: absolute !important;
            transform: translate(-50%, -50%) !important;
            z-index: 9999 !important; /* Garantir que fique acima de tudo */
        }

        .floating-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: var(--cor-primaria);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(38, 40, 94, 0.4); /* Sombra suave no tom azul */
            cursor: pointer;
            border: none;
            z-index: 1000;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .floating-button:hover {
            transform: scale(1.1);
            filter: brightness(1.2);
        }

        .floating-button:active {
            transform: scale(0.9);
        }

        .floating-button img {
            width: 40px;
            height: 40px;
            filter: brightness(0) invert(1); /* Ícone branco para contraste no azul */
            margin-left: 4px; /* Ajuste ótico para o triângulo do Play */
        }

        /* Texto de instrução */
        #status-text {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
            font-weight: bold;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="wrapper">
        <div id="liveness-viewport">
            <div id="status-text"></div>
        </div>
    </div>

    <button class="floating-button" id="start-trigger" title="Iniciar Câmera">
        <img src="https://cdn-icons-png.flaticon.com/512/0/375.png" alt="Icon">
    </button>

    <script src="src/liveness.js"></script>

    <script>
        const viewport = document.getElementById('liveness-viewport');
        const trigger = document.getElementById('start-trigger');
        const status = document.getElementById('status-text');

        const liveness = new Liveness(viewport, {
            token: "SEU_TOKEN",
            faceapiPath: "libs",
            width: 640,
            height: 480,
            isShowPreview: true,
            // Mantendo o círculo perfeito
            ellipseMaskWidth: 2.5,
            ellipseMaskHeight: 2.5,
            ellipseStrokeStyle: "#26285e",           // Borda do círculo em azul
            activatedEllipseStrokeStyle: "#46E3C3",  // Borda em verde ao detectar
            boxMessageBackgroundColor: "#26285e",    // Fundo da mensagem em azul
            boxMessageTextColor: "#ffffff",          // Texto em branco
            
            successCallback: (res) => {
                status.innerText = "Captura realizada com sucesso!";
                trigger.style.display = "flex"; // Botão volta se precisar repetir
            },
            errorCallback: (err) => {
                status.innerText = "Erro. Tente novamente.";
                trigger.style.display = "flex"; // Botão volta em caso de erro
            }
        });

        trigger.addEventListener('click', () => {
            // Em vez de remover o botão, vamos apenas desativá-lo visualmente
            // para que você saiba que ele ainda existe se algo der errado.
            trigger.style.opacity = "0.3";
            trigger.style.pointerEvents = "none";
            
            status.innerText = "Iniciando câmera e modelos...";

            liveness.start(() => {
                status.innerText = "Posicione o rosto dentro do círculo";
                // Agora sim podemos sumir com ele para não atrapalhar o vídeo
                trigger.style.display = "none";
            });
        });
    </script>
</body>
</html>
